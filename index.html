<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Thư viện Yumi</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261114a">
</head>
<body>
<div id="busy" class="busy" hidden></div>

<!-- Màn hình vào -->
<section id="login" class="login" hidden>
  <form id="loginForm" class="login-box">
    <div class="login-emo">📚🍑🌱</div>
    <h1>Thư viện Yumi</h1>
    <p class="muted">Kho tài liệu chung của cô và Linh</p>
    <div class="who-pick" id="whoPick">
      <span class="lbl">Bạn là</span>
      <button type="button" data-who="Cô">👩‍🏫 Cô</button>
      <button type="button" data-who="Linh">🧑‍💻 Linh</button>
    </div>
    <p class="muted small">Bấm vào tên để vào thư viện. Máy sẽ nhớ cho lần sau.</p>
  </form>
</section>

<!-- Ứng dụng -->
<div id="app" hidden>
  <header class="top">
    <div class="brand">📚 <b>Thư viện Yumi</b></div>
    <div class="search">
      <input id="q" type="search" placeholder="🔍 Tìm tài liệu, tag, pack…" title="Gõ không dấu cũng được. Gõ #tag để lọc theo tag. Phím tắt: /" autocomplete="off">
    </div>
    <div class="who">
      <span id="whoLabel" class="chip-who"></span>
      <button id="viewBtn" class="ghost sm" title="Mở hết / thu gọn các bài"></button>
      <button id="refreshBtn" class="ghost sm" title="Tải lại">🔄</button>
      <button id="logoutBtn" class="ghost sm" title="Đổi người dùng">🔁<span class="hide-m"> Đổi người</span></button>
    </div>
  </header>
  <nav class="filters">
    <div class="chips" id="typeChips"></div>
    <div class="chips" id="byChips"></div>
    <div class="chips jump" id="jumpChips"></div>
  </nav>
  <main id="board" class="board"></main>
  <p id="empty" class="empty" hidden></p>
  <button id="fab" class="fab" type="button">＋ Thêm</button>
</div>

<!-- Thêm / sửa bài (giống Padlet): 1 hộp dùng chung -->
<dialog id="postDlg" class="dlg post">
  <form id="postForm">
    <div class="ptop">
      <button type="button" class="pdel" id="pDel" title="Xóa bài này">🗑 Xóa</button>
      <span class="sp"></span>
      <button type="button" class="pcancel" data-close>Hủy</button>
      <button type="submit" class="pgo" id="pGo">Cập nhật</button>
    </div>
    <div class="pbody" id="pBody">
      <input id="pTitle" class="ptitle" autofocus maxlength="150" placeholder="Tiêu đề" autocomplete="off"
        title="Mẹo: {MONTH} tự đổi thành tháng hiện tại (vd Task {MONTH}). Ghi lớp ở đầu như PET01 · Unit 6 Kahoot để hiện nhãn màu lớp.">
      <div class="attach" id="pAttach">
        <div class="att-pick" id="attPick">
          <label class="att-btn" title="Tải file lên (tối đa 20MB/file)"><input type="file" id="fileIn" multiple hidden>⬆️ Tải lên</label>
          <button type="button" class="att-btn" id="attLinkBtn">🔗 Dán link</button>
          <span class="att-hint">hoặc kéo thả file vào đây</span>
        </div>
        <div class="att-link" id="attLink" hidden>
          <span>🔗</span><input id="pUrl" type="url" placeholder="Dán link https://…" autocomplete="off">
          <button type="button" class="icon" id="attLinkX" title="Bỏ link">✕</button>
        </div>
        <div class="att-cur" id="attCur" hidden></div>
        <ul class="files" id="fileList"></ul>
      </div>
      <textarea id="pDesc" class="pdesc" maxlength="20000" placeholder="Viết gì đó…"></textarea>
      <p class="err" id="pErr"></p>
    </div>
    <div class="pfoot">
      <div class="cpick up">
        <button type="button" class="cbtn" data-pop="pColors" title="Màu bài"><span class="cdot"></span><span id="pColorName">Trắng</span> ▾</button>
        <div class="colors pop" id="pColors" hidden></div>
      </div>
      <label class="fsel" title="Pack">§ <select id="pPack"></select></label>
      <label class="fpin" title="Ghim lên đầu pack"><input type="checkbox" id="pPin"> 📌 Ghim</label>
      <label class="fsel ftagl" title="Tag (cách nhau dấu phẩy)">#<input id="pTags" class="ftags" placeholder="tag, cách nhau dấu phẩy" autocomplete="off"></label>
    </div>
  </form>
</dialog>

<!-- Pack -->
<dialog id="packDlg" class="dlg">
  <form id="packForm">
    <h2 id="pkTitle">Pack mới</h2>
    <label>Tên pack <input id="pkName" maxlength="60" required placeholder="vd: IELTS Foundation – Pack 1"></label>
    <div class="lbl">Emoji</div>
    <div class="emojis" id="pkEmojis"></div>
    <div class="lbl">Màu</div>
    <div class="colors" id="pkColors"></div>
    <div class="only-edit move-row">
      <button type="button" class="ghost sm" id="pkLeft">← Dời lên trước</button>
      <button type="button" class="ghost sm" id="pkRight">Dời ra sau →</button>
    </div>
    <p class="err" id="pkErr"></p>
    <div class="btns">
      <button type="button" class="danger only-edit" id="pkDel">🗑 Xóa pack</button>
      <span class="sp"></span>
      <button type="button" class="ghost" data-close>Hủy</button>
      <button type="submit" class="primary">Lưu</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" hidden></div>
<script src="app.js?v=20261114a"></script>
</body>
</html>
